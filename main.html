<style>

	:root {
		--bg: #000000;
		--green: #00ff66;
		--green-dim: #00b34d;
		--green-glow: rgba(0, 255, 102, 0.45);
		--font: 'JetBrains Mono', 'Share Tech Mono', 'Fira Code', monospace;
		--radius: 16px;
	}

	* {
		box-sizing: border-box;
	}

	html {
		min-height: 100%;
		background: var(--bg);
	}

	html, body {
		margin: 0;
		padding: 0;
		font-family: var(--font);
		color: #ddd;
		height: 100vh;
		overflow: hidden;
	}

	body {
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: flex-start;
		position: relative;
		background: transparent;
	}

	/* ============================================================
	   FONDO — foto con blur + vignette (sustituye al shader)
	   Nota: nunca uses z-index negativo aquí — el canvas negro de
	   <html> se pinta antes que cualquier z-index < 0 y lo tapa todo.
	   En vez de eso, estas capas van en z-index 0/1 y el contenido
	   (.app) sube por encima con z-index 2, igual que en el css base.
	   ============================================================ */

	.bg-photo {
		position: fixed;
		inset: -30px;
		z-index: 0;
		background-image: url("background.jpg");
		background-size: cover;
		background-position: center;
		background-repeat: no-repeat;
		filter: blur(10px) brightness(0.75);
		pointer-events: none;
	}

	body::before {
		content: "";
		position: fixed;
		inset: 0;
		z-index: 1;
		background:
			radial-gradient(
				ellipse at center,
				rgba(0, 0, 0, 0.55) 0%,
				rgba(0, 0, 0, 0.82) 100%
			);
		pointer-events: none;
	}
/* contenedor de todo el contenido interactivo, por encima del fondo */
	.app {
		position: relative;
		z-index: 2;
		width: 100%;
		height: 100%;
		display: flex;
		flex-direction: column;
		align-items: center;
		zoom: 1.1;
	}
/* ============================================================
	   BUSCADOR
	   ============================================================ */

	.search-wrap {
		position: relative;
		margin-top: 26px;
		width: 420px;
		max-width: 90vw;
		flex-shrink: 0;
		z-index: 9999;
		display: flex;
		align-items: center;
	}

	/* Prompt de terminal: el > permanece siempre visible y parpadea
	   como un cursor de consola. Se mantiene por encima del input
	   para que nunca quede oculto por su fondo. */
	.search-prompt {
		position: absolute;
		left: 16px;
		top: 50%;
		transform: translateY(-50%);
		z-index: 2;
		display: block;
		color: var(--green);
		font-family: var(--font);
		font-size: 22px;
		font-weight: 600;
		line-height: 1;
		text-shadow: 0 0 6px var(--green-glow);
		pointer-events: none;
		user-select: none;
		animation: searchPromptBlink 1.1s steps(1, end) infinite;
	}

	@keyframes searchPromptBlink {
		0%, 49% {
			opacity: 1;
			visibility: visible;
		}
		50%, 100% {
			opacity: 0.15;
			visibility: visible;
		}
	}

	#custom-search {
		width: 100%;
		padding: 14px 16px 14px 40px;
		font-size: 20px;
		border: 1px solid #222;
		border-radius: 12px;
		outline: none;
		background-color: rgba(0, 0, 0, 0.65);
		backdrop-filter: blur(6px);
		-webkit-backdrop-filter: blur(6px);
		color: var(--green);
		font-family: var(--font);
		letter-spacing: 0.02em;
		transition: border-color 0.2s ease, box-shadow 0.2s ease;
	}

	#custom-search::placeholder {
		color: #4a4a4a;
	}

	#custom-search:focus {
		border-color: var(--green);
		box-shadow: 0 0 14px rgba(0, 255, 102, 0.25);
	}

	/* ============================================================
	   GRID DE ACCESOS
	   ============================================================ */

	/* flex:1 en vez de una altura calculada en vh — así se centra
	   siempre en el espacio restante, sin desajustes por el zoom */
	.cuadrados-wrapper {
		flex: 1;
		min-height: 0;
		display: flex;
		justify-content: center;
		align-items: center;
		width: 100%;
		padding: 20px 10px 40px;
		box-sizing: border-box;
	}

	.cuadrados {
		display: grid;
		grid-template-columns: repeat(4, 235px);
		grid-template-rows: repeat(3, 235px);
		gap: 24px;
	}

	.cuadrados > div {
		width: 235px;
		height: 235px;
		cursor: pointer;
		position: relative;
	}

	.cuadrados > div.empty {
		background: transparent;
		box-shadow: none;
		cursor: default;
		pointer-events: none;
	}

	.tilt {
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 26px;
		background: linear-gradient(145deg, rgba(8, 8, 8, 0.5), rgba(0, 0, 0, 0.5));
		border: 1px solid #1c1c1c;
		border-radius: var(--radius);
		backdrop-filter: blur(6px);
		-webkit-backdrop-filter: blur(6px);
		transform-style: preserve-3d;
		overflow: hidden;
		transition: border-color 0.2s ease, box-shadow 0.25s ease, background 0.2s ease;
	}

	.tilt:hover {
		border-color: var(--green);
		background: linear-gradient(145deg, rgba(0, 20, 10, 0.5), rgba(0, 0, 0, 0.5));
		box-shadow: 0 0 14px rgba(0, 255, 102, 0.16), inset 0 0 24px rgba(0, 255, 102, 0.03);
	}

	/* esquinas HUD que aparecen al pasar el ratón */
	.tilt::before,
	.tilt::after {
		content: "";
		position: absolute;
		width: 14px;
		height: 14px;
		border-color: var(--green);
		border-style: solid;
		border-width: 0;
		opacity: 0;
		transition: opacity 0.2s ease;
		pointer-events: none;
		z-index: 4;
	}

	.tilt::before {
		top: 6px;
		left: 6px;
		border-top-width: 2px;
		border-left-width: 2px;
	}

	.tilt::after {
		bottom: 6px;
		right: 6px;
		border-bottom-width: 2px;
		border-right-width: 2px;
	}

	.tilt:hover::before,
	.tilt:hover::after {
		opacity: 1;
	}

	.tile-label {
		position: absolute;
		left: 0;
		right: 0;
		bottom: 0;
		padding: 8px 6px 10px;
		text-align: center;
		font-size: 0.68rem;
		font-weight: 700;
		letter-spacing: 0.08em;
		text-transform: uppercase;
		color: #aaa;
		background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
		opacity: 0;
		transform: translateY(6px);
		transition: opacity 0.2s ease, transform 0.2s ease, color 0.2s ease, text-shadow 0.2s ease;
		pointer-events: none;
		z-index: 2;
	}

	.tilt:hover .tile-label {
		opacity: 1;
		transform: translateY(0);
		color: var(--green);
		text-shadow: 0 0 6px var(--green-glow);
	}

	.click-layer {
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		z-index: 3;
		text-decoration: none;
	}

	/* ============================================================
	   WATERMARK
	   ============================================================ */

	.watermark {
		position: fixed;
		bottom: 12px;
		right: 16px;
		font-family: var(--font);
		font-size: 0.95rem;
		letter-spacing: 0.05em;
		color: rgba(0, 255, 102, 0.35);
		text-decoration: none;
		z-index: 10000;
		transition: color 0.2s ease, text-shadow 0.2s ease;
	}

	.watermark:hover {
		color: var(--green);
		text-shadow: 0 0 8px var(--green-glow);
	}

	/* ============================================================
	   SCROLLBAR
	   ============================================================ */

	::selection {
		background: var(--green);
		color: #000;
	}

	/* ============================================================
	   RESPONSIVE
	   ============================================================ */

	@media (max-width: 640px) {
		.cuadrados {
			grid-template-columns: repeat(3, minmax(0, 1fr));
			grid-template-rows: repeat(4, minmax(0, 1fr));
			gap: 12px;
			width: 92vw;
		}
		.cuadrados > div {
			width: 100%;
			height: auto;
			aspect-ratio: 1 / 1;
		}
		.tile-label {
			font-size: 0.5rem;
		}
		#custom-search {
			font-size: 16px;
		}
	}

</style>
</head>

<script>
const tiles = document.querySelectorAll('.tilt');

tiles.forEach(tile => {
	const imgSrc = tile.getAttribute('data-img');
	const href = tile.getAttribute('data-link');
	if (!imgSrc) return;

	tile.style.position = 'relative';
	tile.style.perspective = '1000px';

	const wrapper = document.createElement('div');
	wrapper.style.transformStyle = 'preserve-3d';
	wrapper.style.transition = 'transform 0.1s ease-out';
	wrapper.style.width = '100%';
	wrapper.style.height = '100%';

	const img = document.createElement('img');
	img.src = imgSrc;
	img.alt = '';
	img.style.width = '100%';
	img.style.height = '100%';
	img.style.objectFit = 'contain';
	img.style.transition = 'transform 0.3s ease, filter 0.15s ease';
	img.style.filter = 'drop-shadow(0 2px 6px rgba(0,0,0,0.5))';

	wrapper.appendChild(img);
	tile.appendChild(wrapper);

	const label = document.createElement('div');
	label.className = 'tile-label';
	label.textContent = imgSrc.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
	tile.appendChild(label);

	if (href) {
		const a = document.createElement('a');
		a.href = href;
		a.className = 'click-layer';
		tile.appendChild(a);
	}

	let autoAngle = Math.random() * 10;
	let isHovering = false;

	function animateIdleRotation() {
		if (!isHovering) {
			const rotateX = Math.sin(autoAngle) * 5;
			const rotateY = Math.cos(autoAngle) * 5;
			wrapper.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
		}
		autoAngle += 0.008;
		requestAnimationFrame(animateIdleRotation);
	}
	animateIdleRotation();

	tile.addEventListener('mousemove', (e) => {
		isHovering = true;
		const rect = tile.getBoundingClientRect();
		const x = e.clientX - rect.left;
		const y = e.clientY - rect.top;
		const centerX = rect.width / 2;
		const centerY = rect.height / 2;
		const rotateX = ((y - centerY) / centerY) * 8;
		const rotateY = ((x - centerX) / centerX) * 8;
		wrapper.style.transform = `rotateX(${-rotateX}deg) rotateY(${rotateY}deg)`;
		img.style.transform = 'scale(1.05)';
		img.style.filter = `drop-shadow(0 0 1px var(--green-glow))`;
	});

	tile.addEventListener('mouseleave', () => {
		isHovering = false;
		img.style.transform = 'scale(1)';
		img.style.filter = 'drop-shadow(0 2px 6px rgba(0,0,0,0.5))';
	});
});
</script>
